[build]
  publish = "."
  functions = "netlify/functions"

# Brújula y ubicación del celular (modo campo) solo desde este sitio
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "accelerometer=(self), gyroscope=(self), magnetometer=(self), geolocation=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "model/gltf-binary"
