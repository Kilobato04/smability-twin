<script>
/* =====================================================================
   Smability · Reel intro (60 s, una sola toma, 16:9 y 9:16, subtítulos ES/EN) · v5
   1. Sintonía de TV de los 90: la onda se vuelve la «S» del logo. «La naturaleza habla en ondas…»
   2. Limbo azul profundo: la onda viaja en la oscuridad y «enciende» el combo CHAAK + SMAA en su trípode. «El aire no se ve…»
   3. Giro alrededor del combo; SMAA despierta. Dentro de SMAA, a distancia media y con foco por pieza:
      láser (física) → espiral de gas hacia los barriles (química) → pulsos → mediciones → API.
   4. La cámara se abre: el piso del estudio se vuelve una azotea, la ciudad se enciende y llueve; los datos suben a AIreGPT. Cierre.
   Todo se dibuja en función de t (render(t) es determinista): se puede adelantar, pausar y exportar cuadro a cuadro.
   Parámetros: ?lang=es|en  ?format=h|v  ?t=20  ?autoplay=1  ?render=1 (sin controles; expone window.REEL)
               ?map=1  la ciudad del final es Mapbox: el combo en la azotea de la oficina (casa de 2 pisos, 6 m),
                       19.414878, -99.167249. Si Mapbox no carga, se usa la ciudad simulada.
   Datos simulados, sin ciudad ni hora en el texto.
   ===================================================================== */
const CONFIG = {
  duration: 64, smaa: "../models/smaa.glb", chaak: "../models/chaak.glb", tripod: "../models/montaje.glb", logo: "../images/logo_smability.png",
  // Mismo token público de Mapbox que el reel (/reel). En el dashboard de Mapbox restríngelo al dominio de Netlify.
  mapboxToken: 'pk.eyJ1Ijoia2lsb2JhdG8iLCJhIjoiY21jd2g2b3RzMDJiNDJxcTA0cTFhZmE4OCJ9.u5zPxYCxqEaF2jnj32l4ng',
  // Versión Mapbox: azotea de la oficina. roofH: altura de la azotea sobre la calle (m). bearing: rumbo del eje +Z local
  // (grados desde el norte); con 195° la toma final mira hacia el noroeste, a las torres de Reforma.
  site: {lat:19.414878012104744, lon:-99.1672488143469, roofH:6, bearing:195}
};
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=> Math.min(b, Math.max(a, x));
const seg = (t,a,b)=> clamp((t-a)/(b-a));
const ease = x => x*x*(3-2*x);
const sm = x => x*x*x*(x*(x*6 - 15) + 10);                    // smootherstep: entra y sale sin golpe
const eio = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const lerp = (a,b,x)=> a+(b-a)*x;
const win = (t,a,b,f=.5)=> Math.min(ease(seg(t,a,a+f)), 1-ease(seg(t,b-f,b)));     // aparece en a, se va en b
const RENDER_MODE = Q.has("render");
const MAP_MODE = ["1","true","oficina","reforma"].includes((Q.get("map") || "").toLowerCase());
let USE_MAP = MAP_MODE;                       // pasa a false si Mapbox no carga
const D = 5;                                  // reloj de SMAA: lo de dentro de SMAA ocurre 5 s después que en la v1
if(RENDER_MODE) document.body.classList.add("render");

/* ---------- textos y subtítulos ---------- */
let LANG = (Q.get("lang") || "es").toLowerCase().startsWith("en") ? "en" : "es";
const T = {
  es:{ physics:"FÍSICA", chem:"QUÍMICA", data:"DATOS", pd:"FOTODIODO · DISPERSIÓN LÁSER", pdSub:"cada pico es una partícula", el1:"ELECTRODO · CO", el2:"ELECTRODO · O₃", elSub:"corriente de la reacción, en nanoamperes",
       meas:"MEDICIÓN · EN VIVO", sim:"DATOS SIMULADOS", api:"API ABIERTA", online:"● en línea", q:"¿Cómo está el aire en mi colonia?",
       a1:"Calidad del aire: <b>regular</b>. PM2.5 en 38 µg/m³.", a2:"Está lloviendo (4 mm/h): la lluvia lava el aire y el PM2.5 va a bajar en la próxima hora.", a3:"Si sales, lleva paraguas. Para correr, mejor mañana temprano.",
       tag1:"De la física y la química…", tag2:"…a tu mano.", tag3:"Entendemos el aire para ponerlo en tu mano.", wake:"SMAA · EN LÍNEA", wakeSub:"PM2.5 · PM10 · GASES · T/HR · RUIDO",
       chaak:"CHAAK · EN LÍNEA", chaakSub:"VIENTO · LLUVIA · PRESIÓN · RADIACIÓN", ask:"Pregunta a AIreGPT", place:"CIUDAD DE MÉXICO",
       lPM:"SENSOR DE PARTÍCULAS · LÁSER", lGas:"SENSORES ELECTROQUÍMICOS · CO · O₃", lPcb:"TARJETA · MÓDEM 2G/4G" },
  en:{ physics:"PHYSICS", chem:"CHEMISTRY", data:"DATA", pd:"PHOTODIODE · LASER SCATTERING", pdSub:"every peak is a particle", el1:"ELECTRODE · CO", el2:"ELECTRODE · O₃", elSub:"reaction current, in nanoamps",
       meas:"LIVE MEASUREMENT", sim:"SIMULATED DATA", api:"OPEN API", online:"● online", q:"How's the air in my neighborhood?",
       a1:"Air quality: <b>moderate</b>. PM2.5 at 38 µg/m³.", a2:"It's raining (4 mm/h): rain washes the air, so PM2.5 should drop within the hour.", a3:"Take an umbrella if you head out. For a run, wait until tomorrow morning.",
       tag1:"From physics and chemistry…", tag2:"…to your hand.", tag3:"We understand the air to put it in your hand.", wake:"SMAA · ONLINE", wakeSub:"PM2.5 · PM10 · GASES · T/RH · NOISE",
       chaak:"CHAAK · ONLINE", chaakSub:"WIND · RAIN · PRESSURE · RADIATION", ask:"Ask AIreGPT", place:"MEXICO CITY",
       lPM:"PARTICLE SENSOR · LASER", lGas:"ELECTROCHEMICAL SENSORS · CO · O₃", lPcb:"MAIN BOARD · 2G/4G MODEM" }
};
const SUBS = [
  [1.2, 6.5, "La naturaleza habla en ondas. Nosotros la traducimos.", "Nature speaks in waves. We translate it."],
  [8.2, 12.4, "El aire no se ve. Pero se puede entender.", "You can't see the air. But you can understand it."],
  [13.4, 17.6, "CHAAK lee el viento, la lluvia y el sol…", "CHAAK reads the wind, the rain and the sun…"],
  [18.2, 21.8, "…y SMAA despierta…", "…and SMAA wakes up…"],
  [22.0, 25.6, "…para respirar el aire.", "…to breathe the air."],
  [26.6, 31.4, "Un láser cuenta cada partícula que cruza su paso.", "A laser counts every particle that crosses its beam."],
  [32.0, 36.6, "Los gases entran a los electrodos, reaccionan y se vuelven corriente.", "Gases flow into the electrodes, react and become current."],
  [37.3, 41.4, "Cada pulso se vuelve una medición…", "Every pulse becomes a measurement…"],
  [41.6, 46.6, "…y cada medición, un dato abierto, en tu ciudad.", "…and every measurement, open data, in your city."],
  [51.6, 58.2, "Así llega a AIreGPT: para que sepas qué hacer.", "That's how it reaches AIreGPT, so you know what to do."]
];
const tx = k => T[LANG][k];

/* ---------- formato ---------- */
let FMT = Q.get("format") === "v" ? "v" : "h";
const W = () => FMT === "v" ? 1080 : 1920, H = () => FMT === "v" ? 1920 : 1080;

/* ---------- azar determinista ---------- */
function rng(seed){ let a = seed >>> 0; return ()=>{ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (n)=>{ const s = Math.sin(n*127.1 + 311.7)*43758.5453; return s - Math.floor(s); };

/* ================= THREE ================= */
const glc = $("gl"), hud = $("hud"), g = hud.getContext("2d");
const renderer = new THREE.WebGLRenderer({canvas:glc, antialias:true, alpha:true, logarithmicDepthBuffer:true, preserveDrawingBuffer:RENDER_MODE});
renderer.setPixelRatio(1); renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.setClearColor(0x000000, 0);                         // el limbo es el degradado del fondo (#stage); al final, el cielo o Mapbox
const scene = new THREE.Scene();
const LIMBO = new THREE.Color(0x03103f), CITYFOG = new THREE.Color(0x0b1430), FOGD = .009;
scene.fog = new THREE.FogExp2(LIMBO.clone(), .35);
const cam = new THREE.PerspectiveCamera(38, 16/9, .003, 9000);
const V = (x,y,z)=> new THREE.Vector3(x,y,z);
const CITY = new THREE.Group(); scene.add(CITY);              // la ciudad simulada del final (no se usa con Mapbox)

/* luces de estudio: contraluz primero, luego la principal; el combo sale de la oscuridad */
const hemi = new THREE.HemisphereLight(0x6f86c8, 0x0a0c14, .06); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0e0, 0); key.position.set(-40, 30, -30); scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb0ff, .2); rim.position.set(40, 25, 50); scene.add(rim);
const smaaSpot = new THREE.PointLight(0xbfd0ff, 0, 3.5, 2); smaaSpot.position.set(-.8, 3.9, -.5); scene.add(smaaSpot);
const ledLight = new THREE.PointLight(0xff3020, 0, .3, 2); ledLight.position.set(-.052, 3.12, 0); scene.add(ledLight);
const laserLight = new THREE.PointLight(0xff2a2a, 0, .12, 2); laserLight.position.set(-.128, 3.158, -.046); scene.add(laserLight);

/* cielo: degradado de anochecer, resplandor al poniente y los volcanes al oriente */
const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 48, 24), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false, uniforms:{uMix:{value:0}},   // opaco y primero: escribe su color premultiplicado sobre el degradado del limbo
  vertexShader:`varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vD; uniform float uMix;
    float bump(float a, float c, float w, float h){ float d = (a-c)/w; return h*exp(-d*d); }
    void main(){
      float y = vD.y, az = atan(vD.z, vD.x);
      vec3 top = vec3(.008,.016,.055), mid = vec3(.03,.06,.17), hor = vec3(.16,.17,.33);
      vec3 c = mix(hor, mid, smoothstep(0.0,.18,y)); c = mix(c, top, smoothstep(.18,.7,y));
      float west = pow(max(0.0, dot(normalize(vec2(vD.x,vD.z)), normalize(vec2(-1.0,-.35)))), 6.0);
      c += vec3(.55,.22,.10)*west*exp(-max(y,0.0)*14.0)*.9;                      // último resplandor del sol
      float m = bump(az, .55, .10, .045) + bump(az, .78, .16, .03) + bump(az, .70, .05, .012);   // Popocatépetl e Iztaccíhuatl
      if(y < m && y > -.02) c = mix(c, vec3(.045,.055,.11), .85);
      if(y < .0) c = vec3(.02,.025,.05);
      gl_FragColor = vec4(c*uMix, uMix);
    }`
}));
sky.renderOrder = -10; scene.add(sky);


CITY.add(sky); scene.remove(sky);

/* ---------- el combo en su trípode (models/montaje.glb, mástil de 1.12 m), igual que en el gemelo ---------- */
const CHAAK_Y = 2.75, SMAA_Y = CHAAK_Y + .5;                  // SMAA 0.335 m sobre la base de CHAAK + 0.165 m «arriba»
const TRIPOD_TOP = 1.12, ROOF_Y = CHAAK_Y - TRIPOD_TOP, ROOF_H = 6;   // piso del estudio = azotea; la calle 6 m abajo
const COMBO = new THREE.Group(); scene.add(COMBO);
const tripod = new THREE.Group(); tripod.position.set(0, ROOF_Y, 0); COMBO.add(tripod);

/* piso del limbo: brillo suave bajo el trípode que se pierde hacia la orilla, y sombra de contacto */
function radialTex(stops){ const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d"), gr = x.createRadialGradient(256,256,0,256,256,256);
  stops.forEach(([o,col])=> gr.addColorStop(o, col)); x.fillStyle = gr; x.fillRect(0,0,512,512); const tx = new THREE.CanvasTexture(c); tx.encoding = THREE.sRGBEncoding; return tx; }
const limboFloor = new THREE.Mesh(new THREE.CircleGeometry(7, 96), new THREE.MeshBasicMaterial({map:radialTex([[0,"rgba(46,84,200,.55)"],[.35,"rgba(16,36,120,.38)"],[1,"rgba(3,16,63,0)"]]), transparent:true, depthWrite:false, fog:false}));
limboFloor.rotation.x = -Math.PI/2; limboFloor.position.y = ROOF_Y + .002; scene.add(limboFloor);
const contact = new THREE.Mesh(new THREE.CircleGeometry(.55, 64), new THREE.MeshBasicMaterial({map:radialTex([[0,"rgba(0,0,8,.7)"],[1,"rgba(0,0,8,0)"]]), transparent:true, depthWrite:false, fog:false}));
contact.rotation.x = -Math.PI/2; contact.position.y = ROOF_Y + .004; scene.add(contact);

/* ---------- la ciudad del final (simulada): la casa de la azotea, la colonia alrededor y las torres al fondo ---------- */
CITY.position.y = ROOF_Y - ROOF_H;
const HOUSE = {x0:-4.5, x1:7.5, z0:-7, z1:7};
const bMat = new THREE.ShaderMaterial({
  uniforms:{ fogColor:{value:LIMBO.clone()}, fogDensity:{value:.35}, uLit:{value:0}, uGround:{value:0} },
  vertexShader:`#include <common>
    #include <logdepthbuf_pars_vertex>
    varying vec3 vW; varying vec3 vN; varying float vSeed;
    void main(){
      vec4 wp = modelMatrix * instanceMatrix * vec4(position,1.0);
      vW = wp.xyz; vN = normalize(mat3(modelMatrix * instanceMatrix) * normal); vSeed = instanceMatrix[3].x*.013 + instanceMatrix[3].z*.071;
      vec4 mv = viewMatrix * wp; gl_Position = projectionMatrix * mv;
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader:`#include <logdepthbuf_pars_fragment>
    uniform vec3 fogColor; uniform float fogDensity; uniform float uLit; uniform float uGround;
    varying vec3 vW; varying vec3 vN; varying float vSeed;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      #include <logdepthbuf_fragment>
      vec3 base = vec3(.020,.026,.048);
      vec3 c = base * (.6 + .4*max(0.0, dot(vN, normalize(vec3(-.4,.5,-.6)))));
      if(abs(vN.y) < .5){
        float along = abs(vN.x) > .5 ? vW.z : vW.x;
        vec2 cell = floor(vec2(along/2.4, vW.y/3.3)); vec2 f = fract(vec2(along/2.4, vW.y/3.3));
        float win = step(.18, f.x)*step(f.x, .82)*step(.25, f.y)*step(f.y, .78);
        float r = h(cell + vSeed*31.0);
        float lit = step(.80, r) * step(uGround + 2.0, vW.y) * step(length(vW.xz), uLit);   // se encienden en ola desde la azotea
        vec3 warm = mix(vec3(1.0,.72,.42), vec3(.72,.82,1.0), step(.93, r));
        c += win*lit*warm*(.55 + .6*h(cell*1.7 + 3.0));
        c += win*(1.0-lit)*vec3(.012,.018,.035);
      }
      float d = length(vW - cameraPosition);
      float fog = 1.0 - exp(-fogDensity*fogDensity*d*d);
      gl_FragColor = vec4(mix(c, fogColor, fog), 1.0);
    }`
});

(function buildCity(){
  const R = rng(7), boxes = [];
  boxes.push([(HOUSE.x0 + HOUSE.x1)/2, (HOUSE.z0 + HOUSE.z1)/2, HOUSE.x1 - HOUSE.x0, HOUSE.z1 - HOUSE.z0, ROOF_H]);   // la casa (2 pisos)
  for(let gx=-10; gx<=10; gx++) for(let gz=-10; gz<=10; gz++){            // la colonia: casas y edificios de 2 a 6 pisos
    const cx = gx*20 + 10, cz = gz*20;
    if(cx > -16 && cx < -4) continue;                                       // la calle de enfrente (a lo largo de Z)
    for(let k=0;k<2;k++){ const w = 8 + R()*8, d = 9 + R()*8, x = cx + (R()-.5)*6, z = cz + (k ? 5 : -5) + (R()-.5)*3;
      if(x + w/2 > HOUSE.x0 - 1 && x - w/2 < HOUSE.x1 + 1 && z + d/2 > HOUSE.z0 - 1 && z - d/2 < HOUSE.z1 + 1) continue;
      let hgt = 6 + Math.floor(R()*R()*5)*3.2; if(R() < .04) hgt = 26 + R()*20; boxes.push([x, z, w, d, hgt]); }
  }
  for(let k=0;k<16;k++){ const a = -.62 + (R()-.5)*.9, r = 700 + R()*900, hh = 110 + R()*140;   // torres al fondo (hacia donde mira la toma final)
    boxes.push([Math.cos(a)*r, Math.sin(a)*r, 30 + R()*25, 30 + R()*25, hh]); }
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), bMat, boxes.length), m = new THREE.Matrix4();
  boxes.forEach(([x,z,w,d,hh],i)=>{ m.makeScale(w,hh,d); m.setPosition(x, hh/2, z); im.setMatrixAt(i, m); });
  CITY.add(im);
  const mat = (c, r=.85, mt=0)=> new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:mt});
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), mat(0x05070d, .5, .1)); ground.rotation.x = -Math.PI/2; CITY.add(ground);
  /* azotea: losa, pretil, tinacos y un equipo de aire */
  const add = (geo, m2, x, y, z)=>{ const o = new THREE.Mesh(geo, m2); o.position.set(x, y, z); CITY.add(o); return o; };
  add(new THREE.BoxGeometry(HOUSE.x1 - HOUSE.x0, .06, HOUSE.z1 - HOUSE.z0), mat(0x101218, 1, 0), (HOUSE.x0 + HOUSE.x1)/2, ROOF_H + .03, 0);
  const pm2 = mat(0x3a404d);
  add(new THREE.BoxGeometry(HOUSE.x1 - HOUSE.x0, .55, .15), pm2, (HOUSE.x0 + HOUSE.x1)/2, ROOF_H + .27, HOUSE.z0);
  add(new THREE.BoxGeometry(HOUSE.x1 - HOUSE.x0, .55, .15), pm2, (HOUSE.x0 + HOUSE.x1)/2, ROOF_H + .27, HOUSE.z1);
  add(new THREE.BoxGeometry(.15, .55, HOUSE.z1 - HOUSE.z0), pm2, HOUSE.x0, ROOF_H + .27, 0);
  add(new THREE.BoxGeometry(.15, .55, HOUSE.z1 - HOUSE.z0), pm2, HOUSE.x1, ROOF_H + .27, 0);
  const tin = mat(0x101114, .5);
  add(new THREE.CylinderGeometry(.55, .5, 1.15, 28), tin, 6.4, ROOF_H + .62, 5.6); add(new THREE.CylinderGeometry(.55, .5, 1.15, 28), tin, 5.0, ROOF_H + .62, 5.6);
  add(new THREE.BoxGeometry(.9, .7, .45), mat(0x5d636c, .6, .3), 6.6, ROOF_H + .4, -6.0);

  leader(u, 27.6, 32.4, V(-.089, SMAA_Y - .095, .0535), tx("lGas"), V9, w, h);
  leader(u, 32.2, 36.4, V(-.09, SMAA_Y - .058, -.02), tx("lPcb"), V9, w, h);
  bigWord(u, 22.4, 27.0, tx("physics"), bwX, bwY, bwS, al);
  bigWord(u, 27.4, 32.0, tx("chem"), bwX, bwY, bwS, al);
  bigWord(u, 36.6, 41.6, tx("data"), bwX, bwY, bwS, al);

  const pw = V9 ? w*.86 : w*.38, px = V9 ? (w - pw)/2 : w*.585, py = V9 ? h*.58 : h*.14, phh = V9 ? 340 : 320;
  const k1 = win(u, 22.6, 27.2, .5);
  if(k1 > 0){ panel(px, py, pw, phh, k1, tx("pd"), tx("pdSub")); scope(px + 24, py + 90, pw - 48, phh - 114, k1, tt=> spikeAt(tt)*.42, t, "#ff5a5a", 2.2); }
  const k2 = win(u, 27.6, 32.4, .5);
  if(k2 > 0){ panel(px, py, pw, phh + 90, k2, `${tx("el1")}  ·  ${tx("el2")}`, tx("elSub"));
    const sig1 = tt=> .25 + .45*ease(seg(tt - D, 27.6, 30)) + .04*Math.sin(tt*9) + .03*Math.sin(tt*23 + 1), sig2 = tt=> .12 + .22*ease(seg(tt - D, 28, 30.4)) + .03*Math.sin(tt*7 + 2) + .02*Math.sin(tt*31);
    const sh2 = (phh + 90 - 114)/2 - 6; scope(px + 24, py + 90, pw - 48, sh2, k2, sig1, t, "#5cf2b0", 3); scope(px + 24, py + 90 + sh2 + 12, pw - 48, sh2, k2, sig2, t, "#7cc4ff", 3); }
  const k3 = win(u, 32.4, 37.4, .5);
  if(k3 > 0){ const ph3 = 96 + READ.length*54; panel(px, py, pw, ph3, k3, tx("meas"), null);
    g.save(); READ.forEach(([lab, val, un, dd], i)=>{ const a = ease(seg(u, 32.6 + i*.22, 33.6 + i*.22)), v = val*a, y = py + 70 + i*54;
      g.globalAlpha = k3*a; g.font = F(600, 23, "mono"); g.fillStyle = "rgba(199,210,255,.8)"; g.textAlign = "left"; g.textBaseline = "top"; g.fillText(LANG === "en" ? (READ_EN[lab] || lab) : lab, px + 26, y + 9);
      g.font = F(700, 38, "mono"); g.fillStyle = "#fff"; g.textAlign = "right"; g.fillText(v.toFixed(dd), px + pw - 130, y); g.font = F(500, 21, "mono"); g.fillStyle = "#9FB2FF"; g.textAlign = "left"; g.fillText(un, px + pw - 116, y + 13);
      g.fillStyle = "rgba(159,178,255,.14)"; g.fillRect(px + 26, y + 49, pw - 52, 1); });
    g.globalAlpha = k3; g.font = F(600, 16, "mono"); g.fillStyle = "rgba(199,210,255,.55)"; g.textAlign = "right"; g.fillText(tx("sim"), px + pw - 24, py + 24); g.restore(); }
  const k4 = win(u, 37.2, 42.4, .5);
  if(k4 > 0){ const ph4 = 100 + JSON_LINES.length*38; panel(px, py, pw, ph4, k4, tx("api"), null);
    g.save(); g.globalAlpha = k4; g.font = F(500, V9 ? 25 : 24, "mono"); g.textAlign = "left"; g.textBaseline = "top";
    const chars = Math.floor(seg(u, 37.4, 40.6)*JSON_LINES.join("").length); let used = 0;
    JSON_LINES.forEach((l, i)=>{ const n = clamp(chars - used, 0, l.length); used += l.length; const s = l.slice(0, n);
      g.fillStyle = i === 0 ? "#5cf2b0" : /"\w+":/.test(l) ? "#C7D2FF" : "#fff"; g.fillText(s, px + 26, py + 66 + i*38);
      if(n > 0 && n < l.length && Math.floor(t*4)%2) g.fillRect(px + 26 + g.measureText(s).width + 2, py + 68 + i*38, 12, 24); });
    g.restore(); }

  drawPhone(t - 9.4, w, h);

  const ue = t - 9.6, end = ease(seg(ue, 50.0, 51.2));
  if(end > 0){
    g.save(); g.globalAlpha = end; g.fillStyle = "rgba(0,3,14,.92)"; g.fillRect(0, 0, w, h);
    const S = Math.min(w, h)*(V9 ? .2 : .16), cx = w/2, cy = h*(V9 ? .36 : .3);
    g.fillStyle = "#000"; g.fillRect(cx - S/2, cy - S/2, S, S); g.strokeStyle = "rgba(159,178,255,.4)"; g.lineWidth = 2; g.strokeRect(cx - S/2, cy - S/2, S, S);
    const dr = eio(seg(ue, 50.4, 51.8)); g.beginPath(); for(let i=0;i<=80;i++){ const uu = i/80*dr, [x,y] = logoCurve(cx, cy, S, uu); i ? g.lineTo(x,y) : g.moveTo(x,y); }
    g.strokeStyle = "#fff"; g.lineWidth = S*.085; g.lineCap = "butt"; g.shadowColor = "rgba(120,160,255,.9)"; g.shadowBlur = 16; g.stroke(); g.shadowBlur = 0;
    const l1 = ease(seg(ue, 51.0, 51.8)), l2 = ease(seg(ue, 52.0, 52.8)), l3 = ease(seg(ue, 53.0, 53.8)), fs = V9 ? 68 : 76;
    g.textAlign = "center"; g.textBaseline = "top"; g.font = F(800, fs);
    g.globalAlpha = end*l1; g.fillStyle = "#fff"; g.fillText(tx("tag1"), cx, cy + S*.75 + (1-l1)*14);
    g.globalAlpha = end*l2; g.fillStyle = "#9FB2FF"; g.fillText(tx("tag2"), cx, cy + S*.75 + fs*1.25 + (1-l2)*14);
    g.globalAlpha = end*l3; g.font = F(500, V9 ? 30 : 28); g.fillStyle = "rgba(199,210,255,.85)"; g.fillText(tx("tag3"), cx, cy + S*.75 + fs*2.7);
    g.font = F(700, V9 ? 26 : 22, "mono"); g.fillStyle = "rgba(159,178,255,.75)"; g.fillText("smability.io  ·  AIreGPT", cx, h*(V9 ? .86 : .88));
    g.restore();
  }

  drawTuning(t, w, h);

  const cue = SUBS.find(c=> t >= c[0] && t < c[1]);
  if(cue && end < .5){ const a = Math.min(seg(t, cue[0], cue[0]+.25), 1 - seg(t, cue[1]-.25, cue[1])), s = LANG === "en" ? cue[3] : cue[2];
    g.save(); g.globalAlpha = a; g.font = F(600, V9 ? 40 : 38); g.textAlign = "center"; g.textBaseline = "middle";
    const L = wrapText(s, w*(V9 ? .84 : .7)), lh = V9 ? 54 : 50, by = V9 ? h*.905 : h*.885;
    L.forEach((l, i)=>{ const y = by + (i - (L.length-1)/2)*lh, tw = g.measureText(l).width; rr(w/2 - tw/2 - 18, y - lh/2 + 2, tw + 36, lh - 4, 10); g.fillStyle = "rgba(0,4,18,.62)"; g.fill(); g.fillStyle = "#fff"; g.fillText(l, w/2, y); });
    g.restore(); }

  const fin = 1 - ease(seg(t, 0, .6)), fout = ease(seg(t, CONFIG.duration - .7, CONFIG.duration));
  if(fin + fout > 0){ g.fillStyle = `rgba(0,0,0,${Math.max(fin, fout)})`; g.fillRect(0, 0, w, h); }
}

/* ================= MAPBOX (versión ?map=1) =================
   Mapbox aparece solo en la revelación final (detrás del lienzo transparente de three.js), con la misma cámara.
   El combo está en la azotea de la oficina: altura sobre la calle = CONFIG.site.roofH. Ejes locales: +Z hacia el rumbo
   CONFIG.site.bearing, Y arriba; la azotea es y = ROOF_Y en coordenadas del reel. */
let map = null, mapOK = false;
function localToLngLat(x, z){
  const b = CONFIG.site.bearing*Math.PI/180, E = x*Math.cos(b) + z*Math.sin(b), N = -x*Math.sin(b) + z*Math.cos(b);
  const lat0 = CONFIG.site.lat, lon0 = CONFIG.site.lon;
  return [lon0 + E/(111320*Math.cos(lat0*Math.PI/180)), lat0 + N/110574];
}
function syncMap(p, q){
  if(!mapOK) return;
  try{
    p = p || cam.position; const d = q ? q.clone().sub(p).normalize() : (()=>{ const v = new THREE.Vector3(); cam.getWorldDirection(v); return v; })();
    const b = CONFIG.site.bearing*Math.PI/180, dE = d.x*Math.cos(b) + d.z*Math.sin(b), dN = -d.x*Math.sin(b) + d.z*Math.cos(b);
    const bearing = Math.atan2(dE, dN)*180/Math.PI, pitch = clamp(90 + Math.atan2(d.y, Math.hypot(dE, dN))*180/Math.PI, 0, 89);
    const o = map.getFreeCameraOptions();
    o.position = mapboxgl.MercatorCoordinate.fromLngLat(localToLngLat(p.x, p.z), Math.max(1.2, p.y - ROOF_Y + CONFIG.site.roofH));
    o.setPitchBearing(pitch, bearing); map.setFreeCameraOptions(o);
  }catch(e){ console.warn(e); }
}
function mapFov(){ try{ if(map && map.transform && "fov" in map.transform){ map.transform.fov = cam.fov; map.triggerRepaint(); } }catch(_){} }
function initMap(){
  $("map").hidden = false; $("map").style.opacity = 0;
  mapboxgl.accessToken = CONFIG.mapboxToken;
  map = new mapboxgl.Map({container:"map", style:"mapbox://styles/mapbox/standard", center:[CONFIG.site.lon, CONFIG.site.lat], zoom:17, pitch:60, bearing:CONFIG.site.bearing,
    interactive:false, attributionControl:true, fadeDuration:0, antialias:true, preserveDrawingBuffer:RENDER_MODE, pixelRatio:1, trackResize:false,
    config:{basemap:{lightPreset:"night", showPointOfInterestLabels:false, showTransitLabels:false, showPlaceLabels:false, showRoadLabels:false}}});
  map.on("style.load", ()=>{
    try{ map.setFog({range:[.6, 6], color:"rgb(14,22,56)", "high-color":"#0b1d5e", "horizon-blend":.1, "space-color":"#000814", "star-intensity":0}); }catch(_){}
    mapOK = true; mapFov();
    const k = camAt(46); syncMap(k.p, k.q);                  // precarga la vista de la revelación
    map.once("idle", ()=>{ mapReady = true; ready(); });
  });
  map.on("error", e=> console.warn("Mapbox:", e && e.error && e.error.message));
  setTimeout(()=>{ if(!mapReady){ mapReady = true; ready(); } }, 15000);
}
let mapReady = !MAP_MODE;
if(MAP_MODE){
  const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css"; document.head.appendChild(css);
  const sc = document.createElement("script"); sc.src = "https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"; sc.onload = initMap;
  sc.onerror = ()=>{ console.warn("Mapbox no cargó: se usa la ciudad simulada"); USE_MAP = false; mapReady = true; ready(); };
  document.head.appendChild(sc);
}

/* ================= RENDER ================= */
function render(t){
  t = clamp(t, 0, CONFIG.duration);
  const c = camAt(t); cam.position.copy(c.p); cam.lookAt(c.q); cam.updateMatrixWorld();
  if(USE_MAP) syncMap();
  updateScene(t);
  renderer.render(scene, cam);
  drawHUD(t);
}
function fit(){
  const w = W(), h = H(), st = $("stage");
  glc.width = w; glc.height = h; hud.width = w; hud.height = h; renderer.setSize(w, h, false);
  cam.aspect = w/h; cam.fov = FMT === "v" ? 60 : 38; cam.updateProjectionMatrix(); mapFov();
  PT_U.scale.value = h/(2*Math.tan(cam.fov*Math.PI/360));
  st.style.width = w + "px"; st.style.height = h + "px";
  const s = RENDER_MODE ? 1 : Math.min(innerWidth/w, innerHeight/h);
  st.style.transform = RENDER_MODE ? "none" : `translate(${(innerWidth - w*s)/2}px,${(innerHeight - h*s)/2}px) scale(${s})`;
  if(map){ map.resize(); }
  $("bFmt").textContent = FMT === "v" ? "9:16" : "16:9"; $("bLang").textContent = LANG.toUpperCase();
  render(cur);
}
addEventListener("resize", fit);

/* ================= REPRODUCCIÓN ================= */
let cur = clamp(+(Q.get("t") || 0) || 0, 0, CONFIG.duration), playing = false, last = 0;
const fmtT = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function setPlaying(on){
  playing = on; document.body.classList.toggle("playing", on); $("bPlay").textContent = on ? "❚❚" : "▶";
  if(on){ $("play").hidden = true; poke(); } else document.body.classList.remove("idle");
}
function loop(now){
  if(playing){ cur += Math.min(.1, (now - last)/1000); if(cur >= CONFIG.duration){ cur = CONFIG.duration; setPlaying(false); } }
  last = now; render(cur);
  $("scrub").value = cur; $("tOut").textContent = `${fmtT(cur)} / ${fmtT(CONFIG.duration)}`;
  if(!RENDER_MODE) requestAnimationFrame(loop);
}
function play(){ if(cur >= CONFIG.duration) cur = 0; setPlaying(true); }
$("play").onclick = play;
$("bPlay").onclick = ()=>{ playing ? setPlaying(false) : play(); };
$("bLang").onclick = ()=>{ LANG = LANG === "es" ? "en" : "es"; document.documentElement.lang = LANG; fit(); };
$("bFmt").onclick = ()=>{ FMT = FMT === "v" ? "h" : "v"; fit(); };
$("bFs").onclick = ()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
$("scrub").oninput = e=>{ cur = +e.target.value; $("play").hidden = true; };
addEventListener("keydown", e=>{ if(e.key === " "){ e.preventDefault(); $("bPlay").click(); } else if(e.key === "l" || e.key === "L") $("bLang").click(); else if(e.key === "f" || e.key === "F") $("bFs").click(); else if(e.key === "ArrowRight") cur = clamp(cur + 2, 0, CONFIG.duration); else if(e.key === "ArrowLeft") cur = clamp(cur - 2, 0, CONFIG.duration); poke(); });
/* los controles se esconden solos mientras corre el reel; vuelven al mover el mouse o tocar la pantalla */
let idleT; function poke(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(()=>{ if(playing) document.body.classList.add("idle"); }, 2000); }
addEventListener("pointermove", poke); addEventListener("pointerdown", poke);

function ready(){
  if(!modelReady || !mapReady) return;
  Promise.resolve(document.fonts && document.fonts.ready).then(()=>{
    $("load").hidden = true; document.documentElement.lang = LANG; fit();
    if(RENDER_MODE){ window.REEL = { ready:true, duration:CONFIG.duration, seek(t){ render(t); return true; } }; return; }
    if(Q.get("autoplay") === "1") play(); else $("play").hidden = false;
    requestAnimationFrame(t=>{ last = t; loop(t); });
  });
}
</script>
