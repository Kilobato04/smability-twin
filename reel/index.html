  const build = (x1,y1,x2,y2,sp,d)=>{ pts.push([x1,y1]); if(!d){ pts.push([x2,y2]); return; } const mx = (x1+x2)/2 + (r()-.5)*sp, my = (y1+y2)/2 + (r()-.5)*sp*.25; build(x1,y1,mx,my,sp/2,d-1); build(mx,my,x2,y2,sp/2,d-1); };
  k % 2 ? build(.30, 0, .96, .66, .08, 6) : build(.06, 0, .74, .74, .09, 6); return {at, pts}; });
const CALLOUTS = [["chaak",["head","cabezal"],"call1"],["chaak",["tubo","cople_sup"],"call2",.42],["smaa",["solar"],"call3"],["chaak",["tapa","logger"],"call4"],["smaa",["smaa_case","smaa_sens"],"call5"]];
function drawCallouts(t){

  const off = FMT === "v" ? [0,-130] : [230,0], P = TW.centers(CALLOUTS.map(c=> [c[0], c[1], c[3]]));
  const items = P.map((p,i)=> p && p[2] < 1 ? {i, x:p[0]*W() + off[0], y:p[1]*H() + off[1]} : null).filter(Boolean);
  const cx = items.reduce((m,q)=> m + q.x, 0)/Math.max(1, items.length);
  const sides = {L:[], R:[]}; items.forEach(q=> (FMT === "h" || q.x >= cx ? sides.R : sides.L).push(q));
  for(const [k, arr] of Object.entries(sides)){ arr.sort((a,b)=> a.y - b.y); let last = -1e9;
    arr.forEach(q=>{ q.ly = Math.max(q.y, last + 92); last = q.ly; q.side = k; }); }
  wg.save(); wg.textBaseline = "middle";
  items.forEach(q=>{ const a = a0*seg(t, 17.6 + q.i*.22, 18.0 + q.i*.22); if(a <= 0) return;
    wg.font = "700 34px 'Barlow Condensed', 'Arial Narrow', sans-serif"; const tw0 = wg.measureText(T[LANG][CALLOUTS[q.i][2]]).width + 70;
    const lx = q.side === "R" ? (FMT === "h" ? W() - 560 : Math.min(W() - 40 - tw0, Math.max(q.x + 90, W() - 40 - tw0))) : 40 + tw0, ex = q.side === "R" ? lx - 20 : lx + 20;
    wg.strokeStyle = `rgba(255,255,255,${a*.85})`; wg.lineWidth = 2.5; wg.beginPath(); wg.moveTo(q.x, q.y); wg.lineTo(ex - (q.side === "R" ? 40 : -40), q.ly); wg.lineTo(ex, q.ly); wg.stroke();
    wg.fillStyle = `rgba(255,255,255,${a})`; wg.beginPath(); wg.arc(q.x, q.y, 7, 0, 7); wg.fill();
    wg.fillStyle = `rgba(32,70,242,${a})`; wg.beginPath(); wg.arc(q.x, q.y, 3.5, 0, 7); wg.fill();
    const num = String(q.i + 1), txt = T[LANG][CALLOUTS[q.i][2]], R = q.side === "R";
    wg.font = "700 34px 'Barlow Condensed', 'Arial Narrow', sans-serif"; const tw = wg.measureText(txt).width;
    const bx = R ? lx : lx - tw - 58, bw = tw + 58;
    wg.fillStyle = `rgba(0,23,102,${.88*a})`; wg.beginPath(); wg.roundRect ? wg.roundRect(bx - 6, q.ly - 26, bw + 12, 52, 10) : wg.rect(bx - 6, q.ly - 26, bw + 12, 52); wg.fill();
    wg.fillStyle = `rgba(255,255,255,${a})`; wg.beginPath(); wg.arc(bx + 20, q.ly, 17, 0, 7); wg.fill();
    wg.fillStyle = `rgba(0,23,102,${a})`; wg.font = "700 20px 'JetBrains Mono', monospace"; wg.textAlign = "center"; wg.fillText(num, bx + 20, q.ly + 1);
    wg.fillStyle = `rgba(255,255,255,${a})`; wg.font = "700 34px 'Barlow Condensed', 'Arial Narrow', sans-serif"; wg.textAlign = "left"; wg.fillText(txt, bx + 48, q.ly + 1); });
  wg.restore();
}
function drawWeather(t){
  if(wx.width !== W() || wx.height !== H()){ wx.width = W(); wx.height = H(); }
  wg.clearRect(0,0,W(),H());
  drawCallouts(t);
  if(t < 19 || t > 25.6 || !TW) return;
  const off = FMT === "v" ? [0,-130] : [230,0], S = (u,v)=> [u*W() + off[0], v*H() + off[1]];
  // aire que SMAA "respira": corrientes que entran a las cavidades de abajo (ritmo de respiración)
  const sm = seg(t,19.2,20.0)*(1 - seg(t,24.6,25.4));
  if(sm > 0 && TW.sinlet){ const [ix,iy] = S(...TW.sinlet()), br = .75 + .25*Math.sin(t*2.4);
    for(let i=0;i<(MOBILE ? 50 : 110);i++){ const r = rng(i*13+5), a0 = Math.PI*(.15 + r()*.7), R0 = 160 + r()*230, sp = (.38 + r()*.22)*br, p = ((t - 19.2)*sp + r()) % 1, e = p*p*(3-2*p);
      const ang = a0 + (r() < .5 ? 1 : -1)*e*1.1, rad = R0*Math.pow(1-e, 1.35), x = ix + Math.cos(ang)*rad*1.3, y = iy + Math.sin(ang)*rad*.95;
      const s0 = 26*(1-e) + 3, al = .5*Math.sin(Math.PI*Math.min(1, p*1.15))*sm;
      // estela hacia la toma
      const tx = ix - x, ty = iy - y, L = Math.hypot(tx,ty) || 1;
      wg.strokeStyle = `rgba(215,222,240,${al*.28})`; wg.lineWidth = Math.max(1.5, s0*.5); wg.lineCap = "round";
      wg.beginPath(); wg.moveTo(x - tx/L*s0*1.6, y - ty/L*s0*1.6); wg.lineTo(x, y); wg.stroke();
      const gr = wg.createRadialGradient(x,y,0,x,y,s0); gr.addColorStop(0,`rgba(215,222,240,${al})`); gr.addColorStop(1,"rgba(215,222,240,0)");
      wg.fillStyle = gr; wg.beginPath(); wg.arc(x,y,s0,0,7); wg.fill(); }
    const gl = wg.createRadialGradient(ix,iy,0,ix,iy,40); gl.addColorStop(0,`rgba(159,232,255,${.45*sm*br})`); gl.addColorStop(1,"rgba(159,232,255,0)"); wg.fillStyle = gl; wg.beginPath(); wg.arc(ix,iy,40,0,7); wg.fill(); }
  // lluvia intensa con salpicaduras sobre los equipos
  const rn = seg(t,21.6,22.4)*(1 - seg(t,25,25.5));
  if(rn > 0){ drawRain(wg, t, rn, MOBILE ? 140 : 300);
    if(TW.surfaces){ if(SURFKEY !== twinMode){ SURF = TW.surfaces(MOBILE ? 9 : 16); SURFKEY = twinMode; }
      const pts = TW.project(SURF);
      pts.forEach(([u,v,z],i)=>{ if(z > 1) return; const [px,py] = S(u,v), r = rng(i*31+11), rate = 1.6 + r()*1.4, ph = r();
        for(let k = Math.floor(t*rate + ph) - 1; k <= Math.floor(t*rate + ph); k++){ const t0 = (k - ph)/rate, age = t - t0; if(age < 0 || age > .42) continue;
          const rk = rng(i*977 + k*13), a = (1 - age/.42)*rn;
          if(age < .07){ wg.strokeStyle = `rgba(230,235,255,${a*.9})`; wg.lineWidth = 2; wg.beginPath(); wg.ellipse(px, py, 4 + age*120, 1.5 + age*30, 0, 0, 7); wg.stroke(); }
          for(let d=0; d<4; d++){ const ang = Math.PI*(.15 + .7*rk()), v0 = 140 + rk()*170, vx = Math.cos(ang)*v0*(rk() < .5 ? -1 : 1), vy = -Math.sin(ang)*v0;
            const x = px + vx*age, y = py + vy*age + 1500*age*age/2; wg.fillStyle = `rgba(225,232,255,${a})`; wg.beginPath(); wg.arc(x, y, 2.2, 0, 7); wg.fill(); } } }); } }
}
function twinFrameShift(t){
  // en 16:9 el equipo se recorre a la derecha (S3) o a la izquierda (S8) para dejar lugar al texto
  const f = $("twinWrap").style;
  if(FMT === "v"){ f.transform = t > 60 ? "translateY(-230px)" : "translateY(-130px)"; return; }
  f.transform = t > 60 ? "translateX(-380px)" : "translateX(230px)";
}

/* ---------- capas y animaciones de texto ---------- */
const vis = (t,a,b,fi=.5,fo=.5)=> seg(t,a,a+fi)*(1-seg(t,b-fo,b));
function show(el, o){ el.style.opacity = o; }
function rise(el, t, a, b=99){ const x = ease(seg(t,a,a+.6))*(1-seg(t,b-.4,b)); el.style.opacity = x; el.style.transform = `translateY(${(1-ease(seg(t,a,a+.6)))*24}px)`; }
let lastSub = null;
function camAt(t){
  const C0 = {center:[CITY.lon, CITY.lat], zoom:15.5, pitch:54, bearing:-30}, C1 = {center:[CITY.lon, CITY.lat], zoom:15.1, pitch:48, bearing:6};
  const LA = FMT === "v" ? {center:[-74,-40], zoom:2.75, pitch:0, bearing:0} : {center:[-97.5,-12], zoom:2.85, pitch:0, bearing:0}, LA2 = {...LA, zoom:LA.zoom+.12};
  const KC = FMT === "v" ? [CITY.lon, CITY.lat - (NET_CITY ? .04 : -.05)] : [CITY.lon - (NET_CITY ? .10 : .08), CITY.lat + (NET_CITY ? .04 : 0)], zk = NET_CITY ? (NET_CITY.rLat > .15 ? (FMT === "v" ? -.85 : -.6) : 0) : 0;
  const K0 = {center:KC, zoom:(FMT === "v" ? 9.7 : 10.1) + zk, pitch:28, bearing:-8}, K1 = {center:KC, zoom:(FMT === "v" ? 10.0 : 10.5) + zk, pitch:38, bearing:6};
  if(LITE){ const F0 = {center:[CITY.lon, CITY.lat], zoom: FMT === "v" ? 9.9 : 10.3, pitch:0, bearing:0};
    if(t < 7.5) return camLerp(F0, {...F0, zoom:F0.zoom+.35}, seg(t,0,7.5));
    if(t < 13.6) return camLerp(LA, LA2, seg(t,7.5,13.6));
    if(t-SH4 > 24.4 && t-SH4 < 36.6) return camLerp({...K0, pitch:0, bearing:0}, {...K1, pitch:0, bearing:0}, seg(t-SH4,24.4,36.6)); }
  else {
    if(t < 6) return camLerp(C0, C1, seg(t,0,6));

  return null;
}
function render(t){
  // cámara del mapa
  mapFrame(t);
  const cam = camAt(t); if(cam) setCam(cam);
  if(LITE) drawStatic(t);
  show($("Lmap"), Math.max(seg(t,0,1)*(1-seg(t,13,13.6))*(LITE ? 1 - seg(t,6.9,7.4)*(1 - seg(t,7.6,8.3)) : 1), vis(t-SH4,24.6,36.6,.6,.6), vis(t,60.9,69.0,.6,.4)));
  $("smog").style.opacity = .9*(1 - seg(t,6,8.5));
  show($("Lblue"), vis(t,12.8,25.2,.6,.4) || (t > 68.4 ? seg(t,68.4,69) : 0));
  show($("Ltwin"), Math.max(vis(t,12.8,25.2,.8,.5), t > 68.6 ? seg(t,68.6,69.6) : 0));
  twinFrameShift(t);
  drawTwin(t); drawWeather(t);
  drawFX(t);
  // S2
  show($("s2"), vis(t,9.2,13.4)); rise($("s2big"), t, 9.6); rise($("s2leg"), t, 10.2);
  // S3
  show($("s3"), vis(t,13.2,25.2));
  const s3 = $("s3").querySelectorAll(".sup .rise"); rise(s3[0], t, 13.6); rise(s3[1], t, 13.9);
  rise($("it1"), t, 16.6); rise($("noiseTag"), t, 17.0); rise($("it2"), t, 18.2); rise($("it3"), t, 20.8);
  // S4
  { const u = t - SH4;
  show($("s4"), vis(u,25,36.4));
  const s4 = $("s4").querySelectorAll(".sup .rise"); rise(s4[0], u, 25.6); rise(s4[1], u, 25.9);
  const oc = $("oscard"); oc.style.opacity = ease(seg(u,26,26.8)); oc.style.transform = (FMT === "v" ? "translateX(50%) " : "") + `scale(${.9 + .1*ease(seg(u,26,26.8)) + .03*Math.sin(Math.max(0,u-26)*3)*(1-seg(u,29.5,30.5))})`;
  rise($("tagAQ"), u, 29.4); rise($("ias"), u, 29.8); rise($("tagRain"), u, 32.6); rise($("s4note"), u, 26.4); }
  // S5
  { const c = t - SH5;
  show($("s5"), vis(c,36,46.2));
  const s5 = $("s5").querySelectorAll(".sup .rise"); rise(s5[0], c, 36.4); rise(s5[1], c, 36.7);
  rise($("r2a"), c, 39.2); rise($("r2b"), c, 42.6); drawChart(c); }
  // S6
  show($("s6"), vis(t,46,58.2));
  const s6 = $("s6").querySelectorAll(".sup .rise"); rise(s6[0], t, 46.4); rise(s6[1], t, 46.7); rise(s6[2], t, 47.2);
  const pw = $("phoneWrap"), pin = ease(seg(t,46.2,47.2)), mv = eio(seg(t,50.6,51.8)), base = FMT === "v" ? lerp(1.75, 1.05, mv) : lerp(1.4, 1.12, mv);
  if(FMT === "v"){ pw.style.left = "50%"; pw.style.top = `${lerp(52.5, 39, mv)}%`; } else { pw.style.left = `${lerp(62, 81, mv)}%`; pw.style.top = "45%"; }

  $("ring").querySelectorAll(".node").forEach((n,i)=>{ const a = seg(t, 58.4 + i*.5, 58.9 + i*.5); n.style.opacity = a; n.style.transform = `translate(-50%,-50%) scale(${.8 + .2*ease(a)})`; });
  rise($("loopTxt"), t, 59.9);

}
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

/* ---------- reproducción ---------- */
let t = clamp(+Q.get("t") || 0, 0, CONFIG.duration), playing = false, last = 0, lastT = -1, scrubbing = false;
/* ---------- música (tech house, 77 s: intro · drop · intro · drop · cierre) ---------- */
// Solo música en ambos idiomas hasta grabar las voces del guion v4 (mezcla-en.mp3 es del guion anterior y ya no se usa).
const AUDIO_SRC = { es:"audio/musica.mp3", en:"audio/musica.mp3" };
const music = new Audio(AUDIO_SRC[LANG] || AUDIO_SRC.es); music.preload = "auto";
function audioLang(){ const src = AUDIO_SRC[LANG] || AUDIO_SRC.es; if(!music.src.endsWith(src)){ const was = !music.paused; music.pause(); music.src = src; music.load(); if(was) syncAudio(); } }
let muted = Q.get("mute") === "1", primed = false;
function primeAudio(){ if(primed) return; primed = true; music.muted = true; const pr = music.play(); if(pr) pr.then(()=>{ music.pause(); music.muted = false; }).catch(()=>{ music.muted = false; }); }
function syncAudio(){
  const ok = playing && !muted && !Q.has("capture") && t < (music.duration || 77) - .05;
  if(ok){ if(music.paused){ try{ music.currentTime = t; }catch(_){} music.play().catch(()=>{}); } else if(Math.abs(music.currentTime - t) > .25){ try{ music.currentTime = t; }catch(_){} } }
  else if(!music.paused) music.pause();
  music.volume = .85*(1 - seg(t, 75.8, 77.1));
}
function setMute(m){ muted = m; $("bSnd").setAttribute("aria-pressed", m ? "true" : "false"); $("bSnd").textContent = m ? "♪̸" : "♪"; $("bSnd").setAttribute("aria-label", m ? "Activar música" : "Silenciar música"); }
$("bSnd").onclick = ()=>{ primeAudio(); setMute(!muted); };
setMute(muted);
function loop(now){
  if(playing){ t += Math.min(.1, (now - last)/1000); if(t >= CONFIG.duration){ t = CONFIG.duration; setPlaying(false); } }
  last = now;
  syncAudio();
  if(t !== lastT){ render(t); lastT = t; }
  else if(t-SH4 > 24.4 && t-SH4 < 36.6 && map && mapOK) drawFX(t);   // los mosaicos del mapa siguen cargando
  requestAnimationFrame(loop);
}
function setPlaying(p){
  if(p && (map || LITE) && !preDone){ $("playLbl").textContent = (LANG === "en" ? "LOADING MAPS…" : "CARGANDO MAPAS…"); const iv = setInterval(()=>{ if(preDone){ clearInterval(iv); setPlaying(true); } }, 300); setTimeout(()=>{ preDone = true; loadTwin(); }, 25000); return; }
  playing = p; last = performance.now();
  if(p && t >= CONFIG.duration) t = 0;
  $("bPlay").textContent = p ? "❚❚" : "▶"; $("bPlay").setAttribute("aria-label", p ? "Pausa" : "Reproducir");
  $("play").hidden = p || t > 0; poke();
}
$("play").onclick = ()=>{ primeAudio(); setPlaying(true); };
$("bPlay").onclick = ()=>{ primeAudio(); setPlaying(!playing); };
$("scrub").oninput = e=>{ scrubbing = true; t = +e.target.value; $("play").hidden = true; };
$("scrub").onchange = ()=>{ scrubbing = false; };
$("bLang").onclick = ()=>{ LANG = LANG === "en" ? "es" : "en"; applyLang(); lastT = -1; };
$("bFmt").onclick = ()=>{ FMT = FMT === "v" ? "h" : "v"; twinMode = null; fit(); };
$("bFs").onclick = ()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
addEventListener("keydown", e=>{ if(e.code === "Space"){ e.preventDefault(); primeAudio(); setPlaying(!playing); } if(e.key === "ArrowRight"){ t = Math.min(CONFIG.duration, t+5); } if(e.key === "ArrowLeft"){ t = Math.max(0, t-5); } });
let idle;
function poke(){ $("ctl").classList.remove("hide"); clearTimeout(idle); if(playing) idle = setTimeout(()=> $("ctl").classList.add("hide"), 2500); }
addEventListener("pointermove", poke); addEventListener("pointerdown", poke);

// API para exportar cuadro a cuadro (Playwright): REEL.seek(t)
window.REEL = { duration: CONFIG.duration, seek(x){ t = clamp(x, 0, CONFIG.duration); render(t); lastT = t; return t; }, ready: ()=> !!TW, mapReady: ()=> mapOK };

fit(); applyLang(); render(t); lastT = t;
$("play").hidden = t > 0;
if(Q.has("capture")){ $("ctl").style.display = "none"; $("play").hidden = true; }
if(Q.get("autoplay") === "1") setPlaying(true);
requestAnimationFrame(loop);
</script>
