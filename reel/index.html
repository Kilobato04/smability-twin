<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Smability · Del sensor a tu mano</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<style>
:root{--navy:#001766;--brand:#002BAD;--accent:#2046F2;--sky:#9FB2FF;--mist:#C7D2FF;--ice:#E3E9FF;--ink:#000;--muted:#6B6B6B;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;--f-body:'Barlow',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000510;color:#fff;font-family:var(--f-body);overflow:hidden}
#view{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--navy)}
#stage.v{width:1080px;height:1920px}
.layer{position:absolute;inset:0;opacity:0;pointer-events:none}
#map{position:absolute;inset:0}
#map .mapboxgl-ctrl-bottom-left,#map .mapboxgl-ctrl-bottom-right{transform:scale(1.4);transform-origin:bottom right;opacity:.7}
#fx{position:absolute;inset:0;width:100%;height:100%}
#twin{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;color-scheme:normal}
.bgblue{position:absolute;inset:0;background:radial-gradient(70% 80% at 50% 45%,#12339A 0%,#001766 70%,#000B3D 100%)}
.smog{position:absolute;inset:-10%;background:radial-gradient(40% 30% at 30% 70%,rgba(160,150,190,.30),transparent 70%),radial-gradient(50% 35% at 75% 60%,rgba(140,130,170,.26),transparent 70%),linear-gradient(180deg,rgba(0,10,40,.55),rgba(70,60,90,.25) 60%,rgba(0,8,30,.7))}
.vignette{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,4,20,.75))}
/* tipografía de escena */
.kick{font-family:var(--f-mono);font-weight:600;letter-spacing:.16em;font-size:26px;color:var(--sky)}
.title{font-family:var(--f-disp);font-weight:700;font-size:110px;line-height:.92;letter-spacing:.005em}
.big{font-family:var(--f-disp);font-weight:700;font-size:150px;line-height:.9}
.tag{display:inline-flex;align-items:center;gap:12px;font-family:var(--f-mono);font-weight:600;font-size:22px;letter-spacing:.12em;color:#fff;border:1.5px solid var(--sky);border-radius:999px;padding:10px 20px;background:rgba(0,23,102,.55)}
.tag i{width:12px;height:12px;border-radius:50%;background:#2CE57A;box-shadow:0 0 12px #2CE57A}
.note{font-family:var(--f-mono);font-size:18px;letter-spacing:.12em;color:var(--mist);opacity:.8}
.sup{position:absolute;left:96px;top:90px;display:flex;flex-direction:column;gap:16px}
.v .sup{left:72px;top:150px}
.rise{opacity:0;transform:translateY(24px)}
/* subtítulos */
#subs{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:min(1500px,86%);text-align:center;font-family:var(--f-body);font-weight:600;font-size:46px;line-height:1.25;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.7),0 0 18px rgba(0,0,0,.5);z-index:40}
#subs span{background:rgba(0,10,40,.62);padding:6px 18px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.v #subs{bottom:300px;font-size:50px;width:90%}
#bug{position:absolute;right:56px;top:48px;height:46px;opacity:0;z-index:39}
.v #bug{right:56px;top:60px;height:50px}
/* S2 */
#s2 .sup{top:auto;bottom:250px}
.v #s2 .sup{bottom:460px}
.legend{display:flex;gap:32px;font-family:var(--f-mono);font-size:24px;letter-spacing:.08em;color:var(--mist)}
.legend b{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:10px;vertical-align:-1px}
/* S3 */
#s3 .list{position:absolute;left:96px;top:360px;display:flex;flex-direction:column;gap:34px;width:640px}
.v #s3 .list{left:72px;right:72px;top:auto;bottom:450px;width:auto;gap:22px}
.item{display:grid;grid-template-columns:22px 1fr;column-gap:20px;row-gap:6px;align-items:baseline;opacity:0}
.item i{width:22px;height:22px;border-radius:6px;grid-row:span 2;align-self:start;margin-top:8px}
.item b{font-family:var(--f-disp);font-weight:700;font-size:54px;line-height:1}
.item span{font-size:28px;color:var(--ice);line-height:1.3}
.v .item b{font-size:48px}.v .item span{font-size:28px}
#s3 .fallback{position:absolute;left:58%;top:50%;height:86%;transform:translate(-50%,-50%)}
.v #s3 .fallback{left:50%;top:38%;height:52%}
/* S4 */
#oscard{position:absolute;right:96px;top:90px;width:360px;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:0}
.v #oscard{right:50%;transform:translateX(50%);top:330px;width:380px}
#s4 .tags{position:absolute;left:96px;bottom:250px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.v #s4 .tags{left:72px;bottom:560px}
.iasbar{display:grid;grid-template-columns:repeat(5,1fr);width:420px;gap:0;font-family:var(--f-mono);font-size:16px;color:var(--mist);letter-spacing:.06em}
.iasbar div{height:10px;margin-bottom:6px}
/* S5 */
#s5 .chart{position:absolute;left:96px;top:300px;width:1100px;height:560px}
.v #s5 .chart{left:60px;top:640px;width:960px;height:520px}
#s5 .r2{position:absolute;right:110px;top:330px;width:520px;display:flex;flex-direction:column;gap:22px}
.v #s5 .r2{right:auto;left:72px;top:330px;width:936px;flex-direction:row;flex-wrap:wrap;gap:14px 40px}
.r2box{border:1.5px solid rgba(159,178,255,.5);border-radius:16px;padding:24px 28px;background:rgba(0,23,102,.5)}
.r2num{font-family:var(--f-disp);font-weight:700;font-size:150px;line-height:.9}
.r2lbl{font-family:var(--f-mono);font-size:20px;letter-spacing:.1em;color:var(--sky)}
.months{font-family:var(--f-disp);font-weight:700;font-size:84px;line-height:1}
/* S6 teléfono AIreGPT (estilo de airegpt.ai) */
#s6 .sup{max-width:640px}
#phoneWrap{position:absolute;left:62%;top:45%;transform:translate(-50%,-50%) scale(1.4)}
.v #phoneWrap{left:50%;top:47%;transform:translate(-50%,-50%) scale(1.95)}
.phone{width:300px;height:560px;background:linear-gradient(160deg,#1c1c1e,#2c2c2e);border:3px solid #00f2fe;border-radius:35px;position:relative;font-family:'Poppins',sans-serif;box-shadow:0 0 0 1px #3a3a3c,0 30px 80px rgba(0,0,0,.8),0 0 10px 3px #00f2fe,0 0 28px 8px rgba(0,242,254,.6),0 0 60px 15px rgba(0,242,254,.3)}
.phone.shake{animation:shake .55s ease}
@keyframes shake{15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:140px;height:26px;background:#1c1c1e;border-radius:0 0 16px 16px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.notch-time{font-size:9px;font-weight:700;color:#fff}.notch-cam{width:8px;height:8px;background:#000;border-radius:50%;border:1.5px solid #333}
.screen{width:100%;height:100%;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;background:#17212b;position:relative}
.chat-header{background:linear-gradient(135deg,#1a1a3a,#4a3a8a);height:72px;display:flex;align-items:center;padding:28px 12px 0;gap:9px;flex-shrink:0;border-bottom:1px solid rgba(111,66,193,.4)}
.h-avatar{width:34px;height:34px;background:rgba(0,0,0,.4);border:2px solid #00f2fe;border-radius:50%;display:flex;align-items:center;justify-content:center}
.h-avatar svg{width:18px;height:18px;fill:#00f2fe}
.h-name{color:#fff;font-size:13px;font-weight:800;line-height:1}.h-status{color:#00f2fe;font-size:9px;margin-top:1px;font-weight:600}
.chat-area{flex:1;overflow:hidden;background:#17212b;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.msgs{padding:10px 8px;display:flex;flex-direction:column;gap:7px}
.msg{display:none;flex-direction:column}.msg.on{display:flex;animation:fin .4s ease both}
@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg.bot{align-items:flex-start}.msg.user{align-items:flex-end}
.bubble{display:inline-block;padding:8px 11px;border-radius:13px;font-size:11px;line-height:1.5;max-width:85%;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.msg.bot .bubble{background:#212d3b;color:#e8e8e8;border-bottom-left-radius:3px;border:1px solid #2a3a4a}
.msg.user .bubble{background:#2b5278;color:#fff;border-bottom-right-radius:3px;border:1px solid #3a6a99}
.bname{font-size:8.5px;font-weight:800;margin-bottom:2px;letter-spacing:.5px;text-transform:uppercase}
.mtime{font-size:8px;color:rgba(255,255,255,.25);margin-top:2px}.paloma{font-size:8px;color:rgba(42,171,238,.7);margin-top:2px;text-align:right}
.cont-card{display:flex;flex-direction:column;width:220px;border-radius:10px;border-bottom-left-radius:3px;overflow:hidden;border:1px solid #ff3b30;box-shadow:0 0 16px rgba(255,59,48,.35);margin-top:3px}
.cont-header{background:linear-gradient(135deg,#5a0000,#a00000);padding:7px 10px;display:flex;align-items:center;gap:6px}
.cont-title{font-size:10px;font-weight:800;color:#fff;line-height:1.2}.cont-sub{font-size:8px;color:rgba(255,255,255,.6);margin-top:1px}
.cont-body{background:#1e0808;padding:7px 10px;display:flex;flex-direction:column;gap:5px}
.cont-row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.cont-lbl{font-size:8px;color:rgba(255,120,100,.7);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.cont-val{font-size:9px;font-weight:700;color:#ffaaaa;text-align:right}
.cont-val.big{font-family:'Roboto Mono',monospace;font-size:14px;font-weight:900;color:#ff4444}
.cont-block{border-radius:5px;padding:5px 7px;font-size:9px;line-height:1.45}
.cont-block.health{background:#2a0808;border:1px solid rgba(255,100,80,.25);color:#ffcccc}.cont-block.health strong{color:#ff8080;display:block}
.cont-block.hnc{background:#1a0a00;border:1px solid rgba(255,150,0,.3);color:#ffd580}.cont-block.hnc strong{color:#ffa500;display:block}
.aq-card{display:flex;flex-direction:column;width:220px;border-radius:10px;border-bottom-left-radius:3px;overflow:hidden;border:1px solid #00f2fe;margin-top:3px}
.aq-header{background:linear-gradient(135deg,#0a1a2a,#0d2a40);padding:7px 10px;display:flex;align-items:center;gap:6px}
.aq-title{font-size:10px;font-weight:800;color:#00f2fe}.aq-sub{font-size:8px;color:rgba(255,255,255,.5)}
.aq-body{background:#0d1c26;padding:7px 10px;display:flex;flex-direction:column;gap:5px}
.aq-row{display:flex;justify-content:space-between;align-items:center}
.aq-lbl{font-size:8px;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.aq-val{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:900;color:#ff00ff}
.wx-row{display:flex;gap:4px;flex-wrap:wrap}.wx-chip{background:rgba(0,242,254,.07);border:1px solid rgba(0,242,254,.18);border-radius:4px;padding:2px 5px;font-size:8px;color:#9ad0e8;font-family:'Roboto Mono',monospace}.wx-chip span{color:#fff;font-weight:700}
.typing{display:none;align-items:center;gap:4px;padding:7px 10px;background:#212d3b;border-radius:12px;border-bottom-left-radius:3px;width:fit-content;border:1px solid #2a3a4a;margin:0 8px 8px}
.typing.on{display:flex}.typing span{width:5px;height:5px;background:#00f2fe;border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.push{position:absolute;top:30px;z-index:50;left:6px;right:6px;background:rgba(10,20,30,.97);border-radius:12px;padding:9px 10px;display:flex;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.7),0 0 0 1px rgba(0,242,254,.25);transform:translateY(-90px);opacity:0;transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .35s}
.push.on{transform:none;opacity:1}
.push-app{font-size:8px;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.push-title{font-size:10px;font-weight:800;color:#00f2fe}.push-msg{font-size:9px;color:rgba(255,255,255,.75)}
.home-ind{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:3px;background:rgba(255,255,255,.2);border-radius:2px}
/* S7 */
#ring{position:absolute;left:50%;top:47%;width:820px;height:820px;transform:translate(-50%,-50%)}
.v #ring{top:42%}
.node{position:absolute;width:220px;display:flex;flex-direction:column;align-items:center;gap:12px;transform:translate(-50%,-50%);opacity:0}
.node .ic{width:150px;height:150px;border-radius:50%;background:#0B2A9E;border:3px solid var(--sky);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 40px rgba(32,70,242,.6)}
.node .ic img{max-width:100%;max-height:100%}
.node b{font-family:var(--f-mono);font-size:20px;letter-spacing:.1em;color:var(--sky);text-align:center}
.node span{font-family:var(--f-disp);font-weight:700;font-size:36px;text-align:center;line-height:1}
#ring .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:420px}
#stats{position:absolute;left:0;right:0;bottom:200px;display:flex;justify-content:center;gap:110px}
.v #stats{bottom:520px;gap:60px}
.stat{text-align:center;opacity:0}.stat b{display:block;font-family:var(--f-disp);font-weight:700;font-size:110px;line-height:.95}.stat span{font-size:28px;color:var(--mist)}
.v .stat b{font-size:96px}
/* S8 */
#end{position:absolute;right:0;top:0;bottom:0;width:820px;background:linear-gradient(90deg,rgba(0,23,102,0),rgba(0,23,102,.92) 18%,#001766);display:flex;flex-direction:column;justify-content:center;gap:40px;padding:0 96px 120px 180px}
.v #end{left:0;right:0;top:auto;width:auto;height:1100px;background:linear-gradient(180deg,rgba(0,23,102,0),rgba(0,23,102,.94) 16%,#001766);padding:120px 72px 440px;justify-content:flex-end}
#end .title{font-size:96px}
.v #end .title{font-size:92px}
.qrs{display:flex;gap:40px}.qr{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.qr img{width:190px;height:190px;border-radius:12px;background:#fff;padding:8px}
.qr b{font-family:var(--f-mono);font-size:19px;letter-spacing:.08em;color:var(--sky)}
.qr span{font-size:22px;color:var(--ice)}
#end .logo{height:64px;align-self:flex-start}
/* controles */
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(0,8,30,.85),rgba(0,8,30,0));z-index:100;transition:opacity .4s;font-family:var(--f-mono);font-size:13px}
#ctl.hide{opacity:0}
#ctl button{font:600 13px var(--f-mono);letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:8px 12px;cursor:pointer;min-width:44px;min-height:40px}
#ctl button[aria-pressed="true"]{background:#fff;color:var(--navy)}
#ctl input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
#ctl .t{min-width:96px;text-align:center;color:var(--mist)}
#play{position:fixed;inset:0;display:grid;place-items:center;z-index:90;background:rgba(0,8,30,.35);cursor:pointer;border:0;color:#fff}
#play div{display:flex;flex-direction:column;align-items:center;gap:14px;font-family:var(--f-mono);letter-spacing:.14em;font-size:14px}
#play svg{width:96px;height:96px}
#play[hidden]{display:none}
@media (max-width:560px){#ctl{gap:6px;padding-left:8px;padding-right:8px}#ctl button{padding:6px 8px}#ctl .t{min-width:0}#ctl .fs{display:none}}
</style>
</head>
<body>
<div id="view">
<div id="stage">
  <div class="layer" id="Lmap"><div id="map"></div><div class="smog" id="smog"></div><canvas id="fx" width="1920" height="1080"></canvas><div class="vignette"></div></div>
  <div class="layer" id="Lblue"><div class="bgblue"></div></div>
  <div class="layer" id="Ltwin"><img class="fallback" id="twinFallback" src="img/estacion.png" alt=""><iframe id="twin" title="Gemelo digital SMAA y CHAAK" loading="eager"></iframe></div>

  <section class="layer" id="s2">
    <div class="sup"><span class="big rise" id="s2big" data-k="s2big"></span><div class="legend rise" id="s2leg"></div></div>
  </section>

  <section class="layer" id="s3">
    <div class="sup"><span class="kick rise" data-k="s3kick"></span><span class="title rise">SMAA + CHAAK</span></div>
    <div class="list">
      <div class="item" id="it1"><i style="background:#2046F2"></i><b>SMAA</b><span data-k="s3smaa"></span></div>
      <div class="item" id="it2"><i style="background:#7C9BFF"></i><b>CHAAK</b><span data-k="s3chaak"></span></div>
      <div class="item" id="it3"><i style="background:#fff"></i><b data-k="s3poleT"></b><span data-k="s3pole"></span></div>
    </div>
  </section>

  <section class="layer" id="s4">
    <div class="sup"><span class="kick rise" data-k="s4kick"></span><span class="title rise" data-k="s4title"></span></div>
    <img id="oscard" src="img/smaa-os.png" alt="SMAA OS, el cerebro del ecosistema: AWS, IoT en tiempo real, big data, APIs abiertas">
    <div class="tags">
      <span class="tag rise" id="tagAQ"><i></i><span data-k="s4aq"></span></span>
      <div class="iasbar rise" id="ias"><div style="background:#00E400"></div><div style="background:#FFFF00"></div><div style="background:#FF7E00"></div><div style="background:#FF0000"></div><div style="background:#8F3F97"></div><span>0</span><span>50</span><span>100</span><span>150</span><span>200+</span></div>
      <span class="tag rise" id="tagRain"><i style="background:#8B5CF6;box-shadow:0 0 12px #8B5CF6"></i><span data-k="s4rain"></span></span>
      <span class="note rise" id="s4note" data-k="sim"></span>
    </div>
  </section>

  <section class="layer" id="s5">
    <div class="bgblue"></div>
    <div class="sup"><span class="kick rise" data-k="s5kick"></span><span class="title rise" data-k="s5title"></span></div>
    <svg class="chart" id="chart" viewBox="0 0 1100 560" aria-hidden="true"></svg>
    <div class="r2">
      <div class="r2box rise" id="r2a"><div class="r2lbl" data-k="r2lbl"></div><div class="r2num" id="r2num">0.72</div><div class="note" data-k="unam"></div></div>
      <div class="r2box rise" id="r2b"><div class="months" id="months">0</div><div class="r2lbl" data-k="months"></div></div>
    </div>
  </section>

  <section class="layer" id="s6">
    <div class="bgblue"></div>
    <div class="sup"><span class="kick rise" data-k="s6kick"></span><span class="title rise" data-k="s6title"></span><span class="tag rise" id="s6tag" style="align-self:flex-start"><i style="background:#2AABEE;box-shadow:0 0 12px #2AABEE"></i><span data-k="s6tag"></span></span></div>
    <div id="phoneWrap">
      <div class="phone" id="phone">
        <div class="notch"><span class="notch-time">08:14</span><div class="notch-cam"></div></div>

}
function drawFX(t){
  g.clearRect(0,0,W(),H());
  if(t < 13.6 || (t > 24.4 && t < 36.6)) drawGrid();
  // S1 · el primer nodo se enciende
  if(t > 2 && t < 9){ const [x,y] = project(CITY.lon, CITY.lat), a = seg(t,2,2.6)*(1-seg(t,7.4,9));
    for(let k=0;k<3;k++){ const p = ((t*0.7 + k/3) % 1); g.beginPath(); g.arc(x,y, 14 + p*160, 0, 7); g.strokeStyle = `rgba(159,178,255,${a*(1-p)*.9})`; g.lineWidth = 3; g.stroke(); }
    g.beginPath(); g.arc(x,y,12,0,7); g.fillStyle = `rgba(32,70,242,${a})`; g.fill(); g.lineWidth = 3; g.strokeStyle = `rgba(255,255,255,${a})`; g.stroke(); }
  // S2 · ciudades de Latinoamérica: pocas con red, la mayoría a oscuras
  if(t > 8 && t < 13.6){ const a0 = (1-seg(t,12.8,13.6));
    LATAM.forEach((c,i)=>{ const [x,y] = project(c[1], c[0]), a = seg(t, 8 + i*.025, 8.5 + i*.025)*a0;
      if(c[2]){ const pul = .6 + .4*Math.sin(t*4 + i); g.beginPath(); g.arc(x,y,10,0,7); g.fillStyle = `rgba(159,178,255,${a})`; g.shadowColor = "#9FB2FF"; g.shadowBlur = 24*pul; g.fill(); g.shadowBlur = 0; }
      else { g.beginPath(); g.arc(x,y,8,0,7); g.strokeStyle = `rgba(107,123,176,${a*.9})`; g.lineWidth = 2.5; g.stroke(); } }); }
  // S4 · red de la ciudad → SMAA OS → modelos
  if(t > 24.6 && t < 36.6){ const out = 1 - seg(t,35.8,36.6);
    const P = NODES.map(n=> project(n.lon, n.lat));
    // modelo de calidad del aire
    const aq = seg(t,29.2,31.2)*(1 - .55*seg(t,32.4,33.6))*out, R = kmPx(5.5);
    if(aq > 0.01) field(.62*aq, (x,y)=>{ let sw = 0, sv = 0, dmin = 1e9; for(let i=0;i<P.length;i++){ const dx = x-P[i][0], dy = y-P[i][1], d2 = dx*dx+dy*dy+1; dmin = Math.min(dmin, d2); const w = 1/d2; sw += w; sv += w*NODES[i].ias; }
      const a = clamp(1.25 - Math.sqrt(dmin)/R); return a > 0 ? {v: sv/sw, a} : null; }, iasColor);
    // modelo de lluvia (celdas que avanzan con el viento)
    const rn = seg(t,32.4,33.8)*out;
    if(rn > 0.01){ const R2 = kmPx(4), cells = [[-.10,.06,1],[.02,-.03,.8],[.10,.09,.6],[-.02,.12,.5]].map(([dx,dy,s],i)=>{ const drift = (t-32.4)*.012; return [project(CITY.lon + dx + drift, CITY.lat + dy - drift*.4), s]; });
      field(.7*rn, (x,y)=>{ let v = 0; for(const [[cx,cy],s] of cells){ const d2 = ((x-cx)**2 + (y-cy)**2)/(R2*R2); v += s*Math.exp(-d2*1.4); } return v > .12 ? {v: clamp(v), a: clamp((v-.12)*3)} : null; }, rainColor); }
    // nodos
    const na = seg(t,25.2,26.4)*out;
    P.forEach(([x,y],i)=>{ const a = na*seg(t, 25.2 + i*.03, 25.8 + i*.03); g.beginPath(); g.arc(x,y,9,0,7); g.fillStyle = `rgba(255,255,255,${a})`; g.fill(); g.lineWidth = 4; g.strokeStyle = `rgba(32,70,242,${a})`; g.stroke(); });
    // pulsos de datos hacia SMAA OS
    const os = osAnchor(), pa = seg(t,26,26.6)*(1 - seg(t,29.6,30.4));
    if(pa > 0) P.forEach(([x,y],i)=>{ for(let k=0;k<2;k++){ const ph = ((t - 26)*.55 + NODES[i].ph + k*.5) % 1, e = ease(ph);
      const px = lerp(x, os[0], e), py = lerp(y, os[1], e) - Math.sin(e*Math.PI)*80; g.beginPath(); g.arc(px,py,4.5,0,7); g.fillStyle = `rgba(159,178,255,${pa*(1-ph*.6)})`; g.fill(); } });
  }
}
function osAnchor(){ return FMT === "v" ? [W()/2, 480] : [W()-96-180, 200]; }

/* ---------- S5 · gráfica de autocalibración ---------- */
let CH = null;
function buildChart(){
  const svg = $("chart"), w = 1100, h = 560, n = 120, L = T[LANG];
  const ref = i => 300 - 120*Math.sin(i/n*Math.PI*4) - 40*Math.sin(i/n*Math.PI*11 + 1);
  const drift = i => Math.pow(i/n, 1.3)*150;
  const P = f => Array.from({length:n+1}, (_,i)=> `${(60 + i/n*(w-80)).toFixed(1)},${(f(i)).toFixed(1)}`).join(" ");
  svg.innerHTML = `
    <line x1="60" y1="${h-40}" x2="${w-20}" y2="${h-40}" stroke="rgba(159,178,255,.35)" stroke-width="2"/>
    <text x="60" y="${h-6}" fill="#9FB2FF" font-family="JetBrains Mono" font-size="18" letter-spacing="2">0</text>
    <text x="${w-20}" y="${h-6}" fill="#9FB2FF" font-family="JetBrains Mono" font-size="18" text-anchor="end" letter-spacing="2">24 ${LANG==="en"?"MONTHS":"MESES"}</text>
    <polyline id="pRef" points="${P(ref)}" fill="none" stroke="rgba(227,233,255,.55)" stroke-width="4" stroke-dasharray="10 10"/>
    <polyline id="pRaw" points="${P(i=> ref(i) - drift(i) + 14*Math.sin(i*1.7))}" fill="none" stroke="#FF7E5F" stroke-width="5" stroke-linejoin="round"/>
    <polyline id="pCal" points="${P(i=> ref(i) + 5*Math.sin(i*1.3))}" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <g font-family="Barlow" font-size="26" font-weight="600">
      <text id="lRef" x="${w-20}" y="${ref(n)+44}" fill="#E3E9FF" text-anchor="end">${L.ref}</text>
      <text id="lRaw" x="${w-20}" y="${ref(n)-drift(n)-22}" fill="#FF9F85" text-anchor="end">${L.raw}</text>
      <text id="lCal" x="${w-20}" y="${ref(n)-26}" fill="#FFFFFF" text-anchor="end">${L.cal}</text>
    </g>
    <text x="60" y="30" fill="#9FB2FF" font-family="JetBrains Mono" font-size="16" letter-spacing="3" opacity=".75">${L.concept}</text>`;
  CH = {};
  for(const id of ["pRef","pRaw","pCal"]){ const el = svg.querySelector("#"+id), len = el.getTotalLength(); el.style.strokeDasharray = id === "pRef" ? "" : `${len} ${len}`; CH[id] = {el, len}; }
}
function drawChart(t){
  if(!CH) return;
  const a = seg(t,36.4,38.6), b = seg(t,39.2,41.8);
  CH.pRef.el.style.opacity = seg(t,36.2,36.8);
  CH.pRaw.el.style.strokeDashoffset = CH.pRaw.len*(1-a); CH.pRaw.el.style.opacity = 1 - .65*seg(t,41.8,42.6);
  CH.pCal.el.style.strokeDashoffset = CH.pCal.len*(1-b);
  $("chart").querySelector("#lRaw").style.opacity = seg(t,38.2,38.8); $("chart").querySelector("#lCal").style.opacity = seg(t,41.4,42); $("chart").querySelector("#lRef").style.opacity = seg(t,36.8,37.4);
  $("r2num").textContent = (0.72 + 0.19*eio(seg(t,39.4,42))).toFixed(2);
  $("months").textContent = LANG === "en" ? `Up to ${Math.round(24*eio(seg(t,42.6,45.2)))}` : `Hasta ${Math.round(24*eio(seg(t,42.6,45.2)))}`;
}

/* ---------- S6 · chat simulado (de airegpt.ai) ---------- */

  box.innerHTML = user(es ? "¿Cómo está el aire en mi colonia? 🏠" : "How's the air in my neighborhood? 🏠") + aq + cont + rain;
  CHAT = [...box.children].map((el,i)=> ({el, at:[47.2, 49.4, 51.8, 54.9][i]}));
}
const TYPING = [[48.2,49.4],[54.0,54.9]];
function drawChat(t){
  CHAT.forEach(m=> m.el.classList.toggle("on", t >= m.at));
  $("typing").classList.toggle("on", TYPING.some(([a,b])=> t>=a && t<b));
  $("push").classList.toggle("on", t >= 51.2 && t < 53.6);
  const sh = t >= 51.2 && t < 51.8; if(sh !== shaking){ shaking = sh; $("phone").classList.toggle("shake", sh); }
}
let shaking = false;

/* ---------- gemelo digital (iframe) ---------- */
const twin = $("twin");
let TW = null;
twin.src = `${CONFIG.twinUrl}?embed=reel&view=both&theme=dark&city=${CITY.key || "cdmx"}`;
const twinPoll = setInterval(()=>{ try{ const w = twin.contentWindow; if(w && w.TWIN && w.TWIN.loaded()){ TW = w.TWIN; TW.shadows(false); clearInterval(twinPoll); lastT = -1; } }catch(_){} }, 300);
let twinMode = null;
function drawTwin(t){
  const on = (t > 12.6 && t < 25.4) || t > 67.6;
  $("twinFallback").style.display = TW ? "none" : "block";
  if(!TW || !on) return;
  if(t < 40){
    if(twinMode !== "s3"){ twinMode = "s3"; TW.clean(true); TW.rig(false); TW.render("real"); }
    TW.tint("smaa", t >= 16.6 ? 0x2046F2 : null); TW.tint("chaak", t >= 18.2 ? 0x7C9BFF : null);
    TW.explode(FMT === "h" && t >= 21 && t < 23.4);
    const x = seg(t, 12.6, 25.4), v = FMT === "v";
    TW.orbit(lerp(205, 330, eio(x)), lerp(6, 16, x), lerp(v ? 3.5 : 2.15, v ? 3.1 : 1.75, eio(x)), 1.45);
  } else {
    if(twinMode !== "s8" + FMT){ twinMode = "s8" + FMT; TW.tint("smaa", null); TW.tint("chaak", null); TW.explode(false); TW.clean(FMT === "v"); TW.floor(false); TW.zone(false); TW.rig(false); TW.render("real"); }
    const x = seg(t, 67.6, 78), v = FMT === "v";
    TW.orbit(lerp(300, 340, x), lerp(14, 10, x), lerp(v ? 4.2 : 3.4, v ? 3.8 : 3.0, x), v ? 1.3 : 1.35);
  }
}
function twinFrameShift(t){
  // en 16:9 el equipo se recorre a la derecha (S3) o a la izquierda (S8) para dejar lugar al texto
  const f = twin.style;
  if(FMT === "v"){ f.transform = t > 60 ? "translateY(-420px)" : "translateY(-250px)"; return; }
  f.transform = t > 60 ? "translateX(-380px)" : "translateX(230px)";
}

/* ---------- capas y animaciones de texto ---------- */
const vis = (t,a,b,fi=.5,fo=.5)=> seg(t,a,a+fi)*(1-seg(t,b-fo,b));
function show(el, o){ el.style.opacity = o; }
function rise(el, t, a, b=99){ const x = ease(seg(t,a,a+.6))*(1-seg(t,b-.4,b)); el.style.opacity = x; el.style.transform = `translateY(${(1-ease(seg(t,a,a+.6)))*24}px)`; }
let lastSub = null;
function render(t){
  // cámara del mapa
  const C0 = {center:[CITY.lon, CITY.lat], zoom:15.6, pitch:64, bearing:-30}, C1 = {center:[CITY.lon, CITY.lat], zoom:15.1, pitch:58, bearing:6};
  const LA = {center:[-74,-12], zoom: FMT === "v" ? 2.75 : 2.85, pitch:0, bearing:0}, LA2 = {...LA, zoom:LA.zoom+.12};
  const K0 = {center:[CITY.lon, CITY.lat], zoom: FMT === "v" ? 9.7 : 10.1, pitch:32, bearing:-12}, K1 = {center:[CITY.lon, CITY.lat], zoom: FMT === "v" ? 10.3 : 10.8, pitch:46, bearing:10};
  if(t < 6) setCam(camLerp(C0, C1, seg(t,0,6)));
  else if(t < 13.6) setCam(t < 10 ? camLerp(C1, LA, eio(seg(t,6,10))) : camLerp(LA, LA2, seg(t,10,13.6)));
  else if(t > 24.4 && t < 36.6) setCam(camLerp(K0, K1, seg(t,24.4,36.6)));
  show($("Lmap"), Math.max(seg(t,0,1)*(1-seg(t,13,13.6)), vis(t,24.6,36.6,.6,.6)));
  $("smog").style.opacity = .9*(1 - seg(t,6,8.5));
  show($("Lblue"), vis(t,12.8,25.2,.6,.4) || (t > 67.4 ? seg(t,67.4,68) : 0));
  show($("Ltwin"), Math.max(vis(t,12.8,25.2,.8,.5), t > 67.6 ? seg(t,67.6,68.6) : 0));
  twinFrameShift(t);
  drawTwin(t);
  drawFX(t);
  // S2
  show($("s2"), vis(t,9.2,13.4)); rise($("s2big"), t, 9.6); rise($("s2leg"), t, 10.2);
  // S3
  show($("s3"), vis(t,13.2,25.2));
  const s3 = $("s3").querySelectorAll(".sup .rise"); rise(s3[0], t, 13.6); rise(s3[1], t, 13.9);
  rise($("it1"), t, 16.6); rise($("it2"), t, 18.2); rise($("it3"), t, 20.8);
  // S4
  show($("s4"), vis(t,25,36.4));
  const s4 = $("s4").querySelectorAll(".sup .rise"); rise(s4[0], t, 25.6); rise(s4[1], t, 25.9);
  const oc = $("oscard"); oc.style.opacity = ease(seg(t,26,26.8)); oc.style.transform = (FMT === "v" ? "translateX(50%) " : "") + `scale(${.9 + .1*ease(seg(t,26,26.8)) + .03*Math.sin(Math.max(0,t-26)*3)*(1-seg(t,29.5,30.5))})`;
  rise($("tagAQ"), t, 29.4); rise($("ias"), t, 29.8); rise($("tagRain"), t, 32.6); rise($("s4note"), t, 26.4);
  // S5
  show($("s5"), vis(t,36,46.2));
  const s5 = $("s5").querySelectorAll(".sup .rise"); rise(s5[0], t, 36.4); rise(s5[1], t, 36.7);
  rise($("r2a"), t, 39.2); rise($("r2b"), t, 42.6); drawChart(t);
  // S6
  show($("s6"), vis(t,46,58.2));
  const s6 = $("s6").querySelectorAll(".sup .rise"); rise(s6[0], t, 46.4); rise(s6[1], t, 46.7); rise(s6[2], t, 47.2);
  const pw = $("phoneWrap"), pin = ease(seg(t,46.2,47.2)), base = FMT === "v" ? 1.95 : 1.4;
  pw.style.transform = `translate(-50%,${-50 + (1-pin)*30}%) scale(${base}) rotateZ(${(1-pin)*-4}deg)`; pw.style.opacity = pin;
  drawChat(t);
  // S7
  show($("s7"), vis(t,58,68.2));
  $("arc").setAttribute("stroke-dashoffset", 1885*(1 - eio(seg(t,58.6,62.4))));
  $("ring").querySelectorAll(".node").forEach((n,i)=>{ const a = seg(t, 58.6 + i*.9, 59.2 + i*.9); n.style.opacity = a; n.style.transform = `translate(-50%,-50%) scale(${.8 + .2*ease(a)})`; });
  rise($("loopTxt"), t, 61.8);
  document.querySelectorAll(".stat").forEach((s,i)=> rise(s, t, 63 + i*.5));
  { const k = eio(seg(t,62.6,63.6)); $("ring").style.transform = `translate(-50%,${-50 - k*(FMT === "v" ? 16 : 22)}%) scale(${1 - .38*k})`; }
  // S8
  show($("s8"), t > 68 ? seg(t,68,68.8) : 0);
  const s8 = $("end").querySelectorAll(".rise"); rise(s8[0], t, 68.4); rise(s8[1], t, 68.7); rise(s8[2], t, 70.2); rise(s8[3], t, 71);
  // logo
  $("bug").style.opacity = .85*vis(t,1,67.6,1,.4);
  // subtítulos
  const cue = SUBS.find(c=> t >= c[0] && t < c[1]);
  const txt = cue ? (cue[2] === null ? (LANG === "en" ? "Smability · from the sensor to your hand." : "Smability · del sensor a tu mano.") : (LANG === "en" ? cue[3] : cue[2])) : "";
  if(txt !== lastSub){ lastSub = txt; $("subs").innerHTML = txt ? `<span>${txt}</span>` : ""; }
  // controles
  $("tOut").textContent = `${fmt(t)} / ${fmt(CONFIG.duration)}`;
  if(!scrubbing) $("scrub").value = t;
}
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

/* ---------- reproducción ---------- */
let t = clamp(+Q.get("t") || 0, 0, CONFIG.duration), playing = false, last = 0, lastT = -1, scrubbing = false;
function loop(now){
  if(playing){ t += Math.min(.1, (now - last)/1000); if(t >= CONFIG.duration){ t = CONFIG.duration; setPlaying(false); } }
  last = now;
  if(t !== lastT){ render(t); lastT = t; }
  else if(t > 24.4 && t < 36.6 && map && mapOK) drawFX(t);   // los mosaicos del mapa siguen cargando
  requestAnimationFrame(loop);
}
function setPlaying(p){
  playing = p; last = performance.now();
  if(p && t >= CONFIG.duration) t = 0;
  $("bPlay").textContent = p ? "❚❚" : "▶"; $("bPlay").setAttribute("aria-label", p ? "Pausa" : "Reproducir");
  $("play").hidden = p || t > 0; poke();
}
$("play").onclick = ()=> setPlaying(true);
$("bPlay").onclick = ()=> setPlaying(!playing);
$("scrub").oninput = e=>{ scrubbing = true; t = +e.target.value; $("play").hidden = true; };
$("scrub").onchange = ()=>{ scrubbing = false; };
$("bLang").onclick = ()=>{ LANG = LANG === "en" ? "es" : "en"; applyLang(); lastT = -1; };
$("bFmt").onclick = ()=>{ FMT = FMT === "v" ? "h" : "v"; twinMode = null; fit(); };
$("bFs").onclick = ()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
addEventListener("keydown", e=>{ if(e.code === "Space"){ e.preventDefault(); setPlaying(!playing); } if(e.key === "ArrowRight"){ t = Math.min(CONFIG.duration, t+5); } if(e.key === "ArrowLeft"){ t = Math.max(0, t-5); } });
let idle;
function poke(){ $("ctl").classList.remove("hide"); clearTimeout(idle); if(playing) idle = setTimeout(()=> $("ctl").classList.add("hide"), 2500); }
addEventListener("pointermove", poke); addEventListener("pointerdown", poke);

// API para exportar cuadro a cuadro (Playwright): REEL.seek(t)
window.REEL = { duration: CONFIG.duration, seek(x){ t = clamp(x, 0, CONFIG.duration); render(t); lastT = t; return t; }, ready: ()=> !!TW, mapReady: ()=> mapOK };

fit(); applyLang(); render(t); lastT = t;
$("play").hidden = t > 0;
if(Q.has("capture")){ $("ctl").style.display = "none"; $("play").hidden = true; }
if(Q.get("autoplay") === "1") setPlaying(true);
requestAnimationFrame(loop);
</script>
